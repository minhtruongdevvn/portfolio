<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Battery body -->
  <rect x="2" y="5" width="11" height="6" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.95"/>

  <!-- Battery tip -->
  <rect x="13" y="7" width="1.5" height="2" fill="#FFFFFF" opacity="0.95"/>

  <!-- Battery charge level (80%) -->
