<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- WiFi Icon with signal strength bars -->

  <!-- Outer arc (weakest signal) -->
  <path d="M 2 7 Q 8 1 14 7"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.3"
        stroke-linecap="round"
        opacity="0.95"/>

  <!-- Middle-outer arc -->
  <path d="M 3.5 8.5 Q 8 4 12.5 8.5"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.4"
        stroke-linecap="round"
        opacity="0.95"/>

  <!-- Middle-inner arc -->
  <path d="M 5 10 Q 8 7 11 10"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.95"/>

  <!-- Inner arc (strongest signal) -->
  <path d="M 6.5 11.5 Q 8 10 9.5 11.5"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.6"
        stroke-linecap="round"
        opacity="0.95"/>

  <!-- Center dot (connection point) -->
  <circle cx="8" cy="13" r="1.3" fill="#FFFFFF" opacity="0.95"/>
</svg>
