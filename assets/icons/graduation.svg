<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Education - Graduation cap icon -->
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tassleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cap base (mortarboard) -->
  <polygon points="24,14 8,20 24,26 40,20" fill="url(#capGrad)" stroke="#000" stroke-width="1.2"/>

  <!-- Cap top highlight -->
  <polygon points="24,14 18,17 24,20 30,17" fill="rgba(255,255,255,0.2)"/>

  <!-- Cap button/center -->
  <circle cx="24" cy="20" r="1.5" fill="#1A252F" stroke="#000" stroke-width="0.5"/>

  <!-- Tassel string -->
  <line x1="24" y1="20" x2="31" y2="26" stroke="url(#tassleGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tassel -->
  <circle cx="31" cy="26" r="2.5" fill="url(#tassleGrad)" stroke="#B8860B" stroke-width="0.8"/>
  <path d="M 29 27.5 L 31 31 L 33 27.5" stroke="url(#tassleGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Book/diploma below -->
  <rect x="14" y="28" width="20" height="12" rx="1" fill="#8B7355" stroke="#5C4D3F" stroke-width="1"/>
  <rect x="16" y="30" width="16" height="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="16" y="34" width="12" height="1.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="16" y="37" width="14" height="1.5" fill="rgba(255,255,255,0.2)"/>
</svg>
