<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Music Icon - Gradient background circle with musical note -->
  <defs>
    <linearGradient id="musicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF5E78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A6F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="noteGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:0.9" />
    </linearGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="24" cy="24" r="20" fill="url(#musicBg)" filter="url(#softShadow)"/>

  <!-- Subtle inner circle for depth -->
  <circle cx="24" cy="24" r="19" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Modern musical note -->
  <g filter="url(#softShadow)">
    <!-- Note stem -->
    <rect x="27" y="12" width="2.5" height="17" rx="1.25" fill="url(#noteGlow)"/>

    <!-- Note flag (modern curved design) -->
    <path d="M 29.5 12 Q 35 13 35 18 L 35 16 Q 35 13.5 29.5 14.5 Z"
          fill="url(#noteGlow)"
          opacity="0.95"/>

    <!-- Note head (main) -->
    <ellipse cx="24.5" cy="29" rx="5" ry="3.5"
             fill="url(#noteGlow)"/>

    <!-- Eighth note addition -->
    <rect x="19" y="15" width="2.5" height="15" rx="1.25" fill="url(#noteGlow)"/>
    <ellipse cx="17" cy="30" rx="4.5" ry="3.2" fill="url(#noteGlow)"/>

    <!-- Connecting beam between notes -->
    <path d="M 21.5 15 L 27 12 L 27 14 L 21.5 17 Z"
          fill="url(#noteGlow)"
          opacity="0.95"/>
  </g>

  <!-- Decorative sound wave accents -->
  <g opacity="0.4">
    <path d="M 36 22 Q 38 24 36 26"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          fill="none"/>
    <path d="M 38 20 Q 41 24 38 28"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          fill="none"/>
  </g>
</svg>
