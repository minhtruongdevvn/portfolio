<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Projects - Folder with code icon -->
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6C7A89;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#434A54;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#95A5A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C7A89;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Folder tab -->
  <path d="M 8 14 L 8 18 L 20 18 L 22 14 Z" fill="url(#tabGrad)" stroke="#2C3E50" stroke-width="1"/>

  <!-- Folder body -->
  <rect x="8" y="18" width="32" height="20" rx="2" fill="url(#folderGrad)" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- Folder highlight -->
  <rect x="10" y="20" width="28" height="3" rx="1" fill="rgba(255,255,255,0.15)"/>

  <!-- Code symbols -->
  <!-- Left angle bracket < -->
  <path d="M 18 26 L 14 28 L 18 30" stroke="#3498DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Forward slash / -->
  <line x1="21" y1="31" x2="25" y2="25" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"/>

  <!-- Right angle bracket > -->
  <path d="M 28 26 L 32 28 L 28 30" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
