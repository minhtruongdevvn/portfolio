<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Work Experiences - Briefcase icon -->
  <defs>
    <linearGradient id="briefcaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5C2E0A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Briefcase body -->
  <rect x="8" y="18" width="32" height="20" rx="2" fill="url(#briefcaseGrad)" stroke="#3D1F06" stroke-width="1.5"/>

  <!-- Briefcase handle area -->
  <rect x="14" y="12" width="20" height="7" rx="1" fill="#654321" stroke="#3D1F06" stroke-width="1.5"/>

  <!-- Handle -->
  <path d="M 20 12 Q 20 9 24 9 Q 28 9 28 12" fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>

  <!-- Lock/clasp -->
  <rect x="22" y="25" width="4" height="6" rx="0.5" fill="#FFD700" stroke="#B8860B" stroke-width="0.5"/>
  <circle cx="24" cy="28" r="1.5" fill="#B8860B"/>

  <!-- Highlights -->
  <rect x="10" y="20" width="28" height="3" rx="1" fill="rgba(255,255,255,0.15)"/>
</svg>
